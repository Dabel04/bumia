<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bumia - Customer Shop</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body { background-color: #f8f9fa; padding-bottom: 3rem; }
    
    #productsContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    /* Exact same card styling from the vendor page */
    .itemContainer {
      background-color: #fff;
      border: 1px solid rgba(0,0,0,.125);
      border-radius: 0.375rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.075);
      transition: transform 0.2s ease;
    }

    .itemContainer:hover {
      transform: translateY(-5px);
      box-shadow: 0 0.5rem 1rem rgba(0,0,0,.15);
    }

    .itemImage {
      width: 100%;
      height: 220px;
      object-fit: contain;
      padding: 1.5rem;
      border-bottom: 1px solid rgba(0,0,0,.125);
    }

    .itemTitle {
      font-size: 1.25rem;
      font-weight: 500;
      margin: 1rem 1rem 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .itemDesc {
      color: #6c757d;
      font-size: 0.875rem;
      margin: 0 1rem 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1; 
    }

    .itemPrice {
      font-size: 1.25rem;
      font-weight: bold;
      color: #198754;
      margin: 0 1rem 1rem;
    }
    
    .itemPrice::before { content: "$"; }
  </style>
</head>
<body>

  <nav class="navbar navbar-light bg-white border-bottom shadow-sm sticky-top">
    <div class="container">
      <span class="navbar-brand mb-0 h1 fw-bold">Bumia Shop</span>
      
    <a href="cart.html" class="btn btn-dark position-relative">
      🛒 Cart
      <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        0 </span>
    </a>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="fw-bold mb-3">Latest Products</h2>
    <div id="productsContainer">
      
    </div>
  </div>

  <script src="shop.js"></script>
</body>
</html>
