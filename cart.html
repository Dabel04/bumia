<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bumia - My Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding-bottom: 3rem; }
    .cart-item-img { width: 80px; height: 80px; object-fit: contain; }
  </style>
</head>
<body>

  <nav class="navbar navbar-light bg-white border-bottom shadow-sm sticky-top mb-4">
    <div class="container d-flex justify-content-between">
      <span class="navbar-brand mb-0 h1 fw-bold">Bumia Cart</span>
      <a href="shop.html" class="btn btn-outline-dark">Back to Shop</a>
    </div>
  </nav>

  <div class="container">
    <h2 class="fw-bold mb-4">Your Shopping Cart</h2>
    
    <div class="row">
      <div class="col-lg-8">
        <ul id="cartItemsContainer" class="list-group shadow-sm mb-4">
          </ul>
      </div>

      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title fw-bold border-bottom pb-2">Order Summary</h5>
            <div class="d-flex justify-content-between mt-3 mb-3">
              <span class="fs-5">Total:</span>
              <span class="fs-4 fw-bold text-success" id="cartTotalDisplay">$0.00</span>
            </div>
            <button class="btn btn-primary w-100 fw-bold py-2" onclick="checkout()">Proceed to Checkout</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="cart.js"></script>
</body>
</html>
