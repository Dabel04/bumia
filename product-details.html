<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bumia - Product Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding-bottom: 3rem; }
    .product-img { max-height: 400px; object-fit: contain; width: 100%; padding: 2rem; background: white; border-radius: 0.5rem; border: 1px solid rgba(0,0,0,.125); }
  </style>
</head>
<body>

  <nav class="navbar navbar-light bg-white border-bottom shadow-sm sticky-top">
    <div class="container">
      <a href="shop.html" class="navbar-brand mb-0 h1 fw-bold text-decoration-none text-dark">Bumia Shop</a>
      <a href="cart.html" class="btn btn-dark position-relative">
        🛒 Cart
        <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
      </a>
    </div>
  </nav>

  <div class="container mt-5">
    <a href="shop.html" class="btn btn-sm btn-outline-secondary mb-4">&larr; Back to Shop</a>
    
    <div id="productDetailContainer" class="row">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>
  </div>

  <script src="product-details.js"></script>
</body>
</html>
